[package]
name = "mplab-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"  # edition 2024 floor; only tested on 1.100

[dependencies]
axum = "0.8.9"
nix = { version = "0.32.0", features = ["signal"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net"] }
tower-http = { version = "0.7.1", features = ["cors"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
